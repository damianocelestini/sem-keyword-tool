  <text x="756" y="354" font-size="11.5" font-family="monospace" fill="#475569">id, dealPermalink, keyword, matchType</text>
  <text x="756" y="374" font-size="11.5" font-family="monospace" fill="#475569">searchVolume, clicks, cost, revenue</text>
  <text x="756" y="394" font-size="11.5" font-family="monospace" fill="#475569">status, rejectionReason</text>

  <!-- Table 3.3 -->
  <rect x="738" y="430" width="268" height="100" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" />
  <text x="756" y="456" font-size="13.5" font-family="monospace" font-weight="700" fill="#4c1d95">keyword_batch_submissions</text>
  <text x="756" y="480" font-size="11.5" font-family="monospace" fill="#475569">id, userId, dealPermalink, timestamp</text>
  <text x="756" y="500" font-size="11.5" font-family="monospace" fill="#475569">rawKeywords[], results[], syncedToAds</text>

  <!-- Table 3.4 -->
  <rect x="738" y="548" width="268" height="104" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" />
  <text x="756" y="574" font-size="13.5" font-family="monospace" font-weight="700" fill="#4c1d95">users (RM Rollups)</text>
  <text x="756" y="598" font-size="11.5" font-family="monospace" fill="#475569">id, name, role, country</text>
  <text x="756" y="618" font-size="11.5" font-family="monospace" fill="#475569">directReports[], blendedEgr</text>

