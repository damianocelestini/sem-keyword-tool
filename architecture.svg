  <!-- 2. KEY SERVICES & APIs                                                -->
  <!-- ===================================================================== -->
  <rect x="376" y="116" width="304" height="560" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
  <rect x="376" y="116" width="304" height="42" rx="12" fill="#dbeafe" />
  <text x="396" y="142" font-size="13.5" font-weight="700" fill="#1e40af">2. SERVICES &amp; APIs</text>

  <!-- Card 2.1 -->
  <rect x="394" y="178" width="268" height="140" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="412" y="206" font-size="14" font-weight="700" fill="#1e3a8a">Keyword Validation Engine</text>
  <text x="412" y="232" font-size="12" fill="#475569">• Deduplication (Campaign &amp; Batch)</text>
  <text x="412" y="254" font-size="12" fill="#475569">• Brand &amp; Copyright Denylist Filter</text>
  <text x="412" y="276" font-size="12" fill="#475569">• Min Search Volume Check (&gt;=50/mo)</text>
  <text x="412" y="298" font-size="12" fill="#475569">• Queues Batch for Overnight Sync</text>

  <!-- Card 2.2 -->
  <rect x="394" y="338" width="268" height="140" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="412" y="366" font-size="14" font-weight="700" fill="#1e3a8a">Time-Range Metrics Service</text>
  <text x="412" y="392" font-size="12" fill="#475569">• Dynamic Windows: 7d, 14d, 30d, 90d, YTD</text>
  <text x="412" y="414" font-size="12" fill="#475569">• Recalculates Clicks, Cost, Revenue</text>
  <text x="412" y="436" font-size="12" fill="#475569">• Computes CPC, CTR %, CR %, EGR %</text>

  <!-- Card 2.3 -->
  <rect x="394" y="498" width="268" height="154" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
  <text x="412" y="526" font-size="14" font-weight="700" fill="#1e3a8a">Editorial AI Service (Express)</text>
  <rect x="412" y="538" width="232" height="22" rx="4" fill="#eff6ff" />
  <text x="420" y="553" font-size="11" font-family="monospace" font-weight="700" fill="#1d4ed8">POST /api/editorial-cms/analyze</text>
  <text x="412" y="580" font-size="12" fill="#475569">• Grounded on &lt;100% EGR Keywords</text>
  <text x="412" y="602" font-size="12" fill="#475569">• Sub-2s Timeout &amp; NLP Fallback</text>
  <text x="412" y="624" font-size="12" fill="#475569">• Returns Replace / Add Snippets</text>

