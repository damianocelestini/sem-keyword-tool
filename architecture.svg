  </defs>

  <!-- Light Canvas Background -->
  <rect x="0" y="0" width="1400" height="710" fill="#f8fafc" />

  <!-- Header Banner -->
  <rect x="32" y="24" width="1336" height="68" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <rect x="32" y="24" width="8" height="68" rx="4" fill="#53a318" />
  <text x="60" y="54" font-size="19" font-weight="700" fill="#0f172a">Groupon SEM Keyword Tool — System Architecture</text>
  <text x="60" y="76" font-size="13" fill="#64748b">Logical architecture across Frontend, Core Services, Data Model, and External Integrations (Live vs. Simulated)</text>

  <!-- Legend in Top Right -->
  <rect x="1030" y="42" width="150" height="28" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1" />
  <text x="1044" y="60" font-size="11.5" font-weight="700" fill="#047857">● Live in Prototype</text>
  <rect x="1192" y="42" width="156" height="28" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1" />
  <text x="1206" y="60" font-size="11.5" font-weight="700" fill="#b45309">◌ Simulated Feed/API</text>

  <!-- ===================================================================== -->
  <!-- 1. MAIN FRONTEND ELEMENTS                                             -->
  <!-- ===================================================================== -->
  <rect x="32" y="116" width="304" height="560" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
  <rect x="32" y="116" width="304" height="42" rx="12" fill="#dcfce7" />
  <text x="52" y="142" font-size="13.5" font-weight="700" fill="#166534">1. FRONTEND (React SPA)</text>

  <!-- Card 1.1 -->
  <rect x="50" y="178" width="268" height="140" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5" />
  <text x="68" y="206" font-size="14" font-weight="700" fill="#14532d">Deal / Keywords Tab</text>
  <text x="68" y="232" font-size="12" fill="#475569">• Permalink &amp; Country Lookup</text>
  <text x="68" y="254" font-size="12" fill="#475569">• Deal Price &amp; Net Margin (%)</text>
  <text x="68" y="276" font-size="12" fill="#475569">• Bulk CSV / Text Keyword Upload</text>
  <text x="68" y="298" font-size="12" fill="#475569">• Time-Range Metrics Table</text>

  <!-- Card 1.2 -->
  <rect x="50" y="338" width="268" height="140" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5" />
  <text x="68" y="366" font-size="14" font-weight="700" fill="#14532d">Performance Report Tab</text>
  <text x="68" y="392" font-size="12" fill="#475569">• Executive SEM KPI Summary</text>
  <text x="68" y="414" font-size="12" fill="#475569">• Revenue Manager Rollup Table</text>
  <text x="68" y="436" font-size="12" fill="#475569">• Deal-by-Deal Efficiency Drilldown</text>
  <text x="78" y="456" font-size="11.5" fill="#64748b">(&lt;100% EGR vs &gt;100% EGR)</text>

  <!-- Card 1.3 -->
  <rect x="50" y="498" width="268" height="154" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5" />
  <text x="68" y="526" font-size="14" font-weight="700" fill="#14532d">Editorial CMS Suggester</text>
  <text x="68" y="552" font-size="12" fill="#475569">• City &amp; Category Taxonomy Filter</text>
  <text x="68" y="574" font-size="12" fill="#475569">• Profitable (&lt;100% EGR) Keywords</text>
  <text x="68" y="596" font-size="12" fill="#475569">• 1-Click "Add" or "Replace" Edits</text>
  <text x="68" y="618" font-size="12" fill="#475569">• Auto Headline Title-Casing</text>

