  <rect x="1100" y="214" width="164" height="20" rx="4" fill="#fef3c7" />
  <text x="1108" y="228" font-size="10.5" font-weight="700" fill="#b45309">◌ Simulated in Prototype</text>
  <text x="1100" y="254" font-size="12" fill="#475569">• Active Deal Catalog &amp; Permalinks</text>
  <text x="1100" y="276" font-size="12" fill="#475569">• Localized Pricing &amp; Margin (%)</text>
  <text x="1100" y="298" font-size="12" fill="#475569">• Category Taxonomy Breadcrumbs</text>

  <!-- Card 4.2 -->
  <rect x="1082" y="338" width="268" height="140" rx="10" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,3" />
