  <rect x="1100" y="374" width="164" height="20" rx="4" fill="#fef3c7" />
  <text x="1108" y="388" font-size="10.5" font-weight="700" fill="#b45309">◌ Simulated in Prototype</text>
  <text x="1100" y="414" font-size="12" fill="#475569">• Keyword Planner Search Volume</text>
  <text x="1100" y="436" font-size="12" fill="#475569">• Overnight Batch Campaign Sync</text>
  <text x="1100" y="458" font-size="12" fill="#475569">• Automated Email Recap Dispatch</text>

  <!-- Card 4.3 -->
  <rect x="1082" y="498" width="268" height="154" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="2" />
  <text x="1100" y="524" font-size="14" font-weight="700" fill="#065f46">Google Gemini AI</text>
  <rect x="1100" y="534" width="186" height="20" rx="4" fill="#ecfdf5" />
  <text x="1108" y="548" font-size="10.5" font-weight="700" fill="#047857">● Live API + NLP Fallback</text>
  <text x="1100" y="574" font-size="12" fill="#475569">• `gemini-3.1-flash-lite` (Server-Side)</text>
  <text x="1100" y="596" font-size="12" fill="#475569">• Grounded on Profitable SEM Terms</text>
  <text x="1100" y="618" font-size="12" fill="#475569">• Natural Copy &amp; Headline Rewrites</text>

