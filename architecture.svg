  <rect x="738" y="178" width="268" height="108" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" />
  <text x="756" y="204" font-size="13.5" font-family="monospace" font-weight="700" fill="#4c1d95">deals</text>
  <text x="756" y="228" font-size="11.5" font-family="monospace" fill="#475569">id, permalink, country, city</text>
  <text x="756" y="248" font-size="11.5" font-family="monospace" fill="#475569">taxonomy, assignedRevenueManagerId</text>
  <text x="756" y="268" font-size="11.5" font-family="monospace" fill="#475569">discountPrice, marginAmount</text>

  <!-- Table 3.2 -->
  <rect x="738" y="304" width="268" height="108" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5" />
